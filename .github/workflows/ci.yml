name: Verify website

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate French messages
        run: npm run i18n:validate -- fr

      - name: Validate Spanish messages
        run: npm run i18n:validate -- es

      - name: Validate Arabic messages
        run: npm run i18n:validate -- ar

      - name: Enforce WebP-only raster assets
        run: npm run check:webp

      - name: Production build
        run: npm run build
