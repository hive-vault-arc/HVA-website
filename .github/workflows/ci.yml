name: Verify company website

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend contract, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out company repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Generate the Studio route contract
        run: npm run routes:generate
      - name: Reject frontend-to-Studio route drift
        run: git diff --exit-code -- studio/content-route-contract.ts
      - name: Unit tests
        run: npm test
      - name: Validate all translated message catalogs
        run: |
          npm run i18n:validate -- fr
          npm run i18n:validate -- es
          npm run i18n:validate -- ar
      - name: Enforce WebP-only raster assets
        run: npm run check:webp
      - name: Refresh the public-claim inventory
        run: npm run audit:claims
      - name: Report existing brand-token debt
        continue-on-error: true
        run: npm run audit:brand:strict
      - name: Report existing responsive-system debt
        continue-on-error: true
        run: npm run audit:responsive
      - name: Report unresolved publishing evidence
        continue-on-error: true
        run: npm run audit:seo-artifacts:strict
      - name: Production build
        run: npm run build

  studio:
    name: Studio schema, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out company repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install exact Studio dependencies
        run: npm ci --prefix studio
      - name: Lint
        run: npm --prefix studio run lint
      - name: Check formatting
        run: npm --prefix studio run format:check
      - name: Typecheck
        run: npm --prefix studio run typecheck
      - name: Extract schema and generate query types
        run: |
          npm --prefix studio run schema:extract
          npm --prefix studio run typegen
      - name: Reject schema or TypeGen drift
        run: git diff --exit-code -- studio/schema.json src/sanity/sanity.types.ts
      - name: Build Studio
        run: npm --prefix studio run build
