<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hive Vault ARC — Khalid Chalhi Email Signature</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      align-items: center;
      background: #F1F3F6;
      display: flex;
      justify-content: center;
      padding: 32px 20px;
    }

    .signature-preview {
      background: #ffffff;
      border: 1px solid #dde3ea;
      box-sizing: border-box;
      max-width: 100%;
      overflow: hidden;
      padding: 30px 34px;
    }

    .signature-copy {
      overflow: hidden;
      position: relative;
    }

    @keyframes hva-copy-enter {
      0% {
        clip-path: inset(0 0 0 100%);
        filter: blur(5px);
        opacity: 0;
        transform: translate3d(86px, 0, 0);
      }
      28% {
        clip-path: inset(0 0 0 22%);
        filter: blur(2px);
        opacity: 0.72;
      }
      100% {
        clip-path: inset(0);
        filter: blur(0);
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes hva-fade-sweep {
      0% {
        opacity: 1;
        transform: translateX(70%);
      }
      72% {
        opacity: 0.68;
      }
      100% {
        opacity: 0;
        transform: translateX(-115%);
      }
    }

    @keyframes hva-icon-enter {
      0% {
        opacity: 0;
        transform: translate3d(14px, 0, 0) scale(0.88);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .signature-line {
      animation: hva-copy-enter 1050ms cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: clip-path, filter, opacity, transform;
    }

    .signature-line:nth-child(2) { animation-delay: 55ms; }
    .signature-line:nth-child(3) { animation-delay: 100ms; }
    .signature-line:nth-child(4) { animation-delay: 145ms; }

    .signature-copy::after {
      animation: hva-fade-sweep 880ms cubic-bezier(0.16, 1, 0.3, 1) 40ms both;
      background: linear-gradient(90deg, rgba(255,255,255,0), #ffffff 42%, rgba(255,255,255,0));
      content: "";
      inset: 0;
      pointer-events: none;
      position: absolute;
      width: 58%;
    }

    .signature-contacts {
      align-items: center;
      display: flex;
      gap: 7px;
      padding-top: 8px;
    }

    .signature-contact-link {
      align-items: center;
      animation: hva-icon-enter 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
      color: #536174;
      display: inline-flex;
      height: 26px;
      justify-content: center;
      text-decoration: none;
      transition: color 160ms ease;
      width: 26px;
    }

    .signature-contact-link:nth-child(1) { animation-delay: 620ms; }
    .signature-contact-link:nth-child(2) { animation-delay: 690ms; }
    .signature-contact-link:nth-child(3) { animation-delay: 760ms; }

    .signature-contact-link:hover,
    .signature-contact-link:focus-visible {
      color: #E8A838;
    }

    .signature-contact-icon {
      display: block;
      height: 17px;
      width: 17px;
    }

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        justify-content: flex-start;
        padding: 18px 12px;
      }

      .signature-preview {
        padding: 22px 18px;
      }

      .signature-logo-cell {
        padding-right: 12px !important;
      }

      .signature-logo-frame {
        height: 76px !important;
        width: 76px !important;
      }

      .signature-logo {
        height: 80px !important;
        margin: -2px !important;
        width: 80px !important;
      }

      .signature-copy-cell {
        padding-left: 12px !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .signature-line,
      .signature-copy::after,
      .signature-contact-link {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="signature-preview">
    <!-- Copy only this presentation table when installing the signature. -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;font-family:Manrope,Arial,Helvetica,sans-serif;color:#1A2535;">
      <tr>
        <td class="signature-logo-cell" style="padding:0 18px 0 0;vertical-align:middle;">
          <a href="https://hivevaultarc.com" target="_blank" rel="noopener noreferrer" style="border:0;display:block;text-decoration:none;">
            <span class="signature-logo-frame" style="display:block;height:104px;overflow:hidden;width:104px;">
              <img class="signature-logo" src="https://hivevaultarc.com/assets/email/hva-signature-logo.webp" width="108" height="108" alt="Hive Vault Arc" style="border:0;display:block;height:108px;margin:-2px;outline:none;text-decoration:none;width:108px;">
            </span>
          </a>
        </td>
        <td width="1" style="background:#E8A838;font-size:1px;line-height:1px;min-width:1px;width:1px;">&nbsp;</td>
        <td class="signature-copy-cell" style="overflow:hidden;padding:0 0 0 18px;vertical-align:middle;white-space:nowrap;">
          <div class="signature-copy">
            <div class="signature-line" style="color:#1A2535;font-size:18px;font-weight:700;letter-spacing:-0.2px;line-height:22px;">Khalid Chalhi</div>
            <div class="signature-line" style="color:#E8A838;font-size:13px;font-weight:700;line-height:18px;padding-top:4px;">Co-Founder &amp; CEO</div>
            <div class="signature-line" style="color:#1A2535;font-size:13px;font-weight:600;line-height:18px;">Hive Vault ARC</div>
            <div class="signature-line signature-contacts" style="align-items:center;display:flex;gap:7px;padding-top:8px;">
              <a class="signature-contact-link" href="https://hivevaultarc.com" target="_blank" rel="noopener noreferrer" aria-label="Visit Hive Vault ARC website" title="Visit hivevaultarc.com" style="align-items:center;color:#536174;display:inline-flex;height:26px;justify-content:center;text-decoration:none;width:26px;">
                <img class="signature-contact-icon" src="https://hivevaultarc.com/assets/email/icon-globe.webp" width="17" height="17" alt="Website" style="border:0;display:block;height:17px;outline:none;width:17px;">
              </a>
              <a class="signature-contact-link" href="mailto:khalid.chalhi@hivevaultarc.com" aria-label="Email Khalid Chalhi" title="khalid.chalhi@hivevaultarc.com" style="align-items:center;color:#536174;display:inline-flex;height:26px;justify-content:center;text-decoration:none;width:26px;">
                <img class="signature-contact-icon" src="https://hivevaultarc.com/assets/email/icon-email.webp" width="17" height="17" alt="Email" style="border:0;display:block;height:17px;outline:none;width:17px;">
              </a>
              <a class="signature-contact-link" href="https://www.linkedin.com/in/khalid-chalhi/" target="_blank" rel="noopener noreferrer" aria-label="Khalid Chalhi on LinkedIn" title="Khalid Chalhi on LinkedIn" style="align-items:center;color:#536174;display:inline-flex;height:26px;justify-content:center;text-decoration:none;width:26px;">
                <img class="signature-contact-icon" src="https://hivevaultarc.com/assets/email/icon-linkedin.webp" width="17" height="17" alt="LinkedIn" style="border:0;display:block;height:17px;outline:none;width:17px;">
              </a>
            </div>
          </div>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
