<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIIVA - Web Development Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital,wght@0,400;1,400&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                    serif: ['DM Serif Display', 'serif'],
                },
                extend: {
                    colors: {
                        'brand-black': '#18181b',
                        'brand-gray': '#f4f4f5',
                        'brand-accent': '#8B5CF6',
                    },
                    fontWeight: {
                        thin: 100,
                        extralight: 200,
                        light: 300,
                        normal: 400,
                        medium: 500,
                        semibold: 600,
                        bold: 700,
                        extrabold: 800,
                        black: 900,
                    },
                },
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fff;
            color: #18181b;
        }
        .navbar-blur {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #ececec;
            box-shadow: 0 2px 8px 0 rgba(0,0,0,0.03);
        }
        .nav-link {
            font-weight: 400;
            letter-spacing: 0.04em;
            font-size: 1.05rem;
            transition: color 0.2s;
            padding: 0.25rem 0.75rem;
        }
        .nav-link:hover {
            color: #8B5CF6;
        }
        .nav-cta {
            font-weight: 500;
            border-bottom: 1px solid #8B5CF6;
            color: #18181b;
            transition: color 0.2s, border 0.2s;
        }
        .nav-cta:hover {
            color: #8B5CF6;
            border-bottom: 2px solid #8B5CF6;
        }
        .footer-minimal {
            background: #fff;
            color: #b0b0b0;
            font-size: 0.95rem;
            border-top: 1px solid #ececec;
            padding: 2rem 0 1rem 0;
            text-align: center;
            letter-spacing: 0.02em;
        }
        .title-serif { font-family: 'DM Serif Display', serif; letter-spacing: -0.01em; }
        .title-big { font-size: 3.5rem; font-weight: 400; line-height: 1.1; }
        .title-medium { font-size: 2.2rem; font-weight: 400; line-height: 1.15; }
        .title-small { font-size: 1.3rem; font-weight: 400; line-height: 1.2; }
    </style>
</head>
<body>
    <!-- Minimal Navbar -->
    <nav class="navbar-blur fixed w-full top-0 left-0 z-50">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-20">
            <a href="index.html" class="flex items-center space-x-2">
                <span class="text-2xl font-light tracking-tight title-serif">HIIVA</span>
            </a>
            <div class="hidden md:flex items-center space-x-8">
                <a href="about.html" class="nav-link">About</a>
                <a href="portfolio.html" class="nav-link">Portfolio</a>
                <a href="services.html" class="nav-link">Services</a>
                <a href="pricing.html" class="nav-link">Pricing</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="#" class="nav-link">Blog</a>
            </div>
            <div class="flex items-center">
                <a href="#" class="nav-cta hidden md:inline-block">Book a Call <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i></a>
                <button class="md:hidden ml-4 text-2xl"><i class="fas fa-bars"></i></button>
            </div>
        </div>
        <!-- Mobile menu (hidden by default) -->
        <div class="md:hidden hidden bg-white/95 border-t border-gray-100" id="mobileMenu">
            <div class="flex flex-col space-y-2 px-6 py-4">
                <a href="about.html" class="nav-link">About</a>
                <a href="portfolio.html" class="nav-link">Portfolio</a>
                <a href="services.html" class="nav-link">Services</a>
                <a href="pricing.html" class="nav-link">Pricing</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="#" class="nav-link">Blog</a>
                <a href="#" class="nav-cta">Book a Call <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i></a>
            </div>
        </div>
    </nav>

    <main class="pt-24 min-h-[80vh]">
        <!-- Page content will be injected here -->
    </main>

    <footer class="footer-minimal">
        &copy; 2024 Hive Vault Arc (HIIVA). All rights reserved.
    </footer>

    <script>
        // Mobile menu toggle
        document.querySelector('button.md\\:hidden').onclick = function() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        };
        // Close mobile menu on link click
        document.querySelectorAll('#mobileMenu a').forEach(link => {
            link.onclick = () => document.getElementById('mobileMenu').classList.add('hidden');
        });
    </script>
</body>
</html>
